# Both LLM examples in Docker:   docker compose up --build   ->  http://localhost:8080/
#
# The API key comes from your shell, or from a .env file next to this file (.env is in .gitignore):
#   ANTHROPIC_API_KEY=sk-ant-...
# Without a key the pages, the API and the MCP server work; only the model calls report the missing key.
#
# The demo database lives inside the container: `docker compose down` and `up` start with fresh data.

services:
  web:
    build: .
    ports: ["8080:80"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
