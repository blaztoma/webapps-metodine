<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2 · MCP — ParcelShop</title>
  <link rel="stylesheet" href="../shared/chat.css">
</head>
<body data-endpoint="chat.php">
  <header>
    <h1>2 · MCP <span style="font-weight:normal;opacity:.7">— ParcelShop</span></h1>
    <label><span id="lbl-user">Naudotojas</span> <select id="user"></select></label>
    <button id="db" type="button" title="SQLite">DB</button>
    <button id="clear" type="button">Išvalyti</button>
    <button id="lang" type="button">EN</button>
  </header>
  <div class="strip"></div>
  <main>
    <section class="panel">
      <h2 id="h-chat">Pokalbis</h2>
      <div id="chat"></div>
      <form id="form">
        <input id="q" autocomplete="off" maxlength="2000">
        <button id="send" type="submit">Siųsti</button>
      </form>
      <div class="examples" id="examples"></div>
      <p class="hint">browser → <code>chat.php</code> (MCP client) → model · tools → <code>server.php</code> (MCP server, Streamable HTTP) → SQLite</p>
    </section>
    <section class="panel">
      <h2 id="h-trace">Kas vyko serveryje</h2>
      <div id="trace"></div>
    </section>
  </main>
  <dialog id="db-dialog">
    <div class="db-head">
      <h2 id="db-title">Duomenų bazė (tik skaitymui)</h2>
      <span class="meta" id="db-meta"></span>
      <button id="db-reload" type="button">Atnaujinti</button>
      <button id="db-close" type="button">Uždaryti</button>
    </div>
    <div id="db-body"></div>
  </dialog>
  <script src="../shared/chat.js"></script>
</body>
</html>
